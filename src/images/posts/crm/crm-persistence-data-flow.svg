<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1220" viewBox="0 0 640 1220" role="img" aria-labelledby="title desc">
  <title id="title">在线确认与 SQLite 故障补传的两条独立链路</title>
  <desc id="desc">在线样本进入内存后经 MQTT 提交后端，严格 MQTT 入库收据只释放匹配内存。离线或在线故障按原 ID 和时间写 SQLite，由 Qt 批量 HTTP 上传并验证收据，再本地 ACK 标记 synced，保留历史。老化事件和安全执行元数据持续落盘。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b86d3e"/></marker></defs>
  <rect width="640" height="1220" rx="20" fill="#fbf5eb"/>
  <g fill="none" stroke="#b86d3e" stroke-width="3" marker-end="url(#a)"><path d="M320 160V195H160V230"/><path d="M320 195H480V230"/><path d="M300 286H340"/><path d="M160 340V420"/><path d="M480 340V420"/><path d="M160 520V610"/><path d="M480 520V610"/><path d="M160 710V810"/><path d="M480 710V810"/><path d="M160 910V980"/><path d="M480 910V980"/></g>
  <g fill="#fffaf2" stroke="#d4c1ab" stroke-width="2"><rect x="170" y="70" width="300" height="90" rx="15"/><rect x="20" y="230" width="280" height="110" rx="15"/><rect x="340" y="230" width="280" height="110" rx="15"/><rect x="20" y="420" width="280" height="100" rx="15"/><rect x="340" y="420" width="280" height="100" rx="15"/><rect x="20" y="610" width="600" height="100" rx="15"/><rect x="20" y="810" width="280" height="100" rx="15"/><rect x="340" y="810" width="280" height="100" rx="15"/><rect x="20" y="980" width="280" height="110" rx="15"/><rect x="340" y="980" width="280" height="110" rx="15"/></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#302b26" font-size="26"><text x="320" y="42">真实提交之后，才确认对应数据</text><text x="320" y="108">采集：稳定 ID + 原始时间</text><text x="320" y="142" fill="#655546" font-size="23">设备信息 / 遥测 / 报警</text><text x="160" y="270">在线内存待确认</text><text x="480" y="270">SQLite 故障历史</text><text x="160" y="310" font-size="23">有界缓冲 + 最新展示</text><text x="480" y="310" font-size="23">pending，保留原 ID</text><text x="160" y="459">MQTT 发布样本</text><text x="160" y="497" font-size="23">PUBACK 不代表入库</text><text x="480" y="459">Qt：HTTP 批量补传</text><text x="480" y="497" font-size="23">batchId + 原始记录</text><text x="320" y="647">后端真实持久化</text><text x="320" y="685" font-size="23">MySQL 业务；遥测写 InfluxDB 后归档 MySQL</text><text x="160" y="849">MQTT 业务收据</text><text x="160" y="885" font-size="23">核对类型 / ID / 时间</text><text x="480" y="849">HTTP 严格收据</text><text x="480" y="885" font-size="23">核对批次 / 完整集合</text><text x="160" y="1020">释放匹配内存</text><text x="160" y="1060" font-size="23">不推进 SQLite synced</text><text x="480" y="1020">Qt → 本地 ACK</text><text x="480" y="1060" font-size="23">标记 synced，保留历史</text></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#8c5534" font-size="21"><text x="159" y="214">在线</text><text x="483" y="214">离线</text><text x="320" y="378">失败 / 断连 / 超时 / 容量 / 退出 → 右路落盘</text><text x="320" y="1149">老化事件、租约与执行归属持续写 SQLite</text><text x="320" y="1185">异常断电仍可能丢失尚未落盘的内存样本</text></g>
</svg>

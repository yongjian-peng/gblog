<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img" aria-labelledby="title desc">
  <title id="title">CRM 四端职责与通信、存储关系</title>
  <desc id="desc">Qt 通过本机 WebSocket 和 HTTP 访问 Agent，并与 Vue 一同访问后端。Agent 与后端通过 MQTT 交换遥测、事件、命令和入库收据；规则使用 Agent 主动连接的 WebSocket。SQLite 归 Agent 所有，MySQL 与 InfluxDB 归后端所有。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#b86d3e"/></marker></defs>
  <rect width="640" height="950" rx="20" fill="#fbf5eb"/>
  <g fill="none" stroke="#b86d3e" stroke-width="3" marker-end="url(#a)"><path d="M154 200V340"/><path d="M486 200V340"/><path d="M254 200V236H486"/><path d="M284 404H356" marker-start="url(#a)"/><path d="M154 466V598H190" marker-start="url(#a)"/><path d="M486 466V598H450" marker-start="url(#a)"/><path d="M24 418H8V826H24"/><path d="M616 418H632V826H616"/></g>
  <g fill="#fffaf2" stroke="#d4c1ab" stroke-width="2"><rect x="24" y="90" width="260" height="110" rx="15"/><rect x="356" y="90" width="260" height="110" rx="15"/><rect x="24" y="340" width="260" height="126" rx="15"/><rect x="356" y="340" width="260" height="126" rx="15"/><rect x="190" y="550" width="260" height="96" rx="15"/><rect x="24" y="756" width="260" height="146" rx="15"/><rect x="356" y="756" width="260" height="146" rx="15"/></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#302b26" font-size="27"><text x="320" y="45">四端协同，各自持有明确职责</text><text x="154" y="132">Qt / QML</text><text x="486" y="132">Vue Web</text><text x="154" y="385">C++ Agent</text><text x="486" y="385">FastAPI</text><text x="320" y="588">MQTT Broker</text><text x="154" y="798">内存 / SQLite v5</text><text x="486" y="798" font-size="25">MySQL / InfluxDB</text></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#655546" font-size="23"><text x="154" y="170">本机交互、监控与补传</text><text x="486" y="170">管理、批量控制与展示</text><text x="154" y="425">采集、压力执行与保护</text><text x="486" y="425">校验、编排与持久化</text><text x="320" y="624">消息与业务入库收据</text><text x="154" y="838">待确认、故障历史</text><text x="154" y="874">任务事件与安全归属</text><text x="486" y="838">业务状态与长期归档</text><text x="486" y="874">时序指标与遥测原文</text><text x="154" y="287" font-size="21">本机 WS / HTTP</text><text x="486" y="287" font-size="21">HTTP / 实时 WS</text><text x="356" y="225" font-size="19">Qt 也访问后端</text><text x="320" y="385" font-size="17">规则</text><text x="320" y="433" font-size="17">WS</text><text x="139" y="516" font-size="20">遥测 / 事件</text><text x="494" y="516" font-size="20">命令 / 收据</text><text x="320" y="935" font-size="18">Agent 主动连接规则 WS；连线表示数据交互关系</text></g>
</svg>

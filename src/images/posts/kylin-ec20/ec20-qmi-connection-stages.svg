<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1130" viewBox="0 0 660 1130" role="img" aria-labelledby="title desc">
  <title id="title">EC20 QMI 联网分层验收</title>
  <desc id="desc">依次检查 SIM_READY、LTE PS Attached、QMI 数据呼叫、wwan0 Raw-IP 与 IPv4、默认路由、公网 IP 通信，最后检查 DNS 解析与域名通信。前一阶段成功不能替代后一阶段验证。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#bc612f"/></marker></defs>
  <rect width="660" height="1130" rx="20" fill="#faf4eb"/>
  <g fill="none" stroke="#bc612f" stroke-width="3" marker-end="url(#arrow)">
    <path d="M330 126V182"/><path d="M330 276V332"/><path d="M330 426V482"/>
    <path d="M330 576V632"/><path d="M330 726V782"/><path d="M330 876V932"/>
  </g>
  <g fill="#fffaf2" stroke="#d9bfa8" stroke-width="2">
    <rect x="60" y="32" width="540" height="94" rx="14"/><rect x="60" y="182" width="540" height="94" rx="14"/>
    <rect x="60" y="332" width="540" height="94" rx="14"/><rect x="60" y="482" width="540" height="94" rx="14"/>
    <rect x="60" y="632" width="540" height="94" rx="14"/><rect x="60" y="782" width="540" height="94" rx="14"/>
    <rect x="60" y="932" width="540" height="94" rx="14"/>
  </g>
  <g fill="#352b25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" text-anchor="middle">
    <text x="330" y="91">1. SIM_READY：SIM 就绪</text>
    <text x="330" y="241">2. LTE PS Attached：分组域附着</text>
    <text x="330" y="391">3. QMI 建立数据呼叫</text>
    <text x="330" y="541">4. wwan0 Raw-IP 与 IPv4 配置</text>
    <text x="330" y="691">5. 默认路由生效</text>
    <text x="330" y="841">6. 指定接口的公网 IP 通信成功</text>
    <text x="330" y="991">7. DNS 解析及域名通信测试</text>
    <text x="330" y="1084" font-size="24" fill="#795f4c">每一阶段均需对应日志与实际通信证据</text>
  </g>
</svg>
